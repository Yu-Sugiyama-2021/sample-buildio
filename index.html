<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>電卓</title>
  </head>
  <body>
    <main class="calculator-page">
      <section class="calculator" aria-label="電卓">
        <div class="calculator-heading">
          <p class="eyebrow">CALCULATOR</p>
          <h1>電卓</h1>
        </div>
        <form class="natural-language-form" id="natural-language-form">
          <label class="natural-language-label" for="natural-language-input">文章で計算する</label>
          <div class="natural-language-controls">
            <input class="natural-language-input" id="natural-language-input" type="text" placeholder="例：25に18を足して" autocomplete="off" />
            <button class="natural-language-submit" type="submit">計算</button>
          </div>
          <p class="natural-language-help" id="natural-language-help">「100の15%」のように入力してください</p>
        </form>
        <div class="display-panel" aria-live="polite" aria-atomic="true">
          <p class="calculation" id="calculation">&nbsp;</p>
          <output class="display" id="display">0</output>
        </div>
        <div class="keypad" aria-label="計算キー">
          <button class="key key-utility" data-action="clear">C</button>
          <button class="key key-utility" data-action="sign">±</button>
          <button class="key key-utility" data-action="percent">%</button>
          <button class="key key-operator" data-operator="÷">÷</button>
          <button class="key" data-number="7">7</button>
          <button class="key" data-number="8">8</button>
          <button class="key" data-number="9">9</button>
          <button class="key key-operator" data-operator="×">×</button>
          <button class="key" data-number="4">4</button>
          <button class="key" data-number="5">5</button>
          <button class="key" data-number="6">6</button>
          <button class="key key-operator" data-operator="−">−</button>
          <button class="key" data-number="1">1</button>
          <button class="key" data-number="2">2</button>
          <button class="key" data-number="3">3</button>
          <button class="key key-operator" data-operator="+">+</button>
          <button class="key key-zero" data-number="0">0</button>
          <button class="key" data-action="decimal">.</button>
          <button class="key key-equals" data-action="equals">=</button>
        </div>
      </section>
      <p class="keyboard-hint">キーボードでも操作できます</p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
